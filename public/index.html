<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Interpreter</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <h1>INTERPRETER</h1>
      </header>

      <section class="language-card" aria-label="Conversation languages">
        <div class="language-choice">
          <span class="choice-label">Language one</span>
          <strong>English</strong>
        </div>
        <span class="swap-arrow" aria-hidden="true">↕</span>
        <label class="language-choice" for="target-language">
          <span class="choice-label">Language two</span>
          <select id="target-language">
            <option value="Spanish">Spanish</option>
            <option value="Brazilian Portuguese">Português (Brasil)</option>
          </select>
        </label>
      </section>

      <section class="status-card" aria-live="polite">
        <span class="status-dot" id="status-dot" data-state="idle"></span>
        <div>
          <span class="status-label">Status</span>
          <strong id="status-text">Ready</strong>
        </div>
      </section>

      <section class="controls" aria-label="Interpreter controls">
        <button class="primary-button" id="start-button" type="button">
          Start Interpreter
        </button>
        <button class="stop-button" id="stop-button" type="button" disabled>
          Stop
        </button>
      </section>

      <section class="transcript-card conversation-card">
        <h2>Conversation</h2>
        <div id="conversation-log" class="conversation-log" aria-live="polite">
          <p class="conversation-placeholder">
            Recent original speech and translations will appear here.
          </p>
        </div>
      </section>

      <audio id="translated-audio" autoplay playsinline></audio>
    </main>
  </body>
</html>
