<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Interpreter</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <nav class="mode-switch" aria-label="Operating mode">
        <button id="interpreter-mode" type="button" aria-pressed="true">
          INTERPRETER
        </button>
        <button id="companion-mode" type="button" aria-pressed="false">
          COMPANION
        </button>
      </nav>

      <header>
        <p class="eyebrow" id="mode-eyebrow">ENGLISH ↔ SPANISH</p>
        <h1 id="mode-title">Interpreter</h1>
      </header>

      <section
        class="language-card interpreter-language-card"
        id="interpreter-language-card"
        aria-label="Interpreter language pair"
      >
        <span>English</span>
        <span aria-hidden="true">↔</span>
        <label for="target-language">
          <span class="sr-only">Second language</span>
          <select id="target-language">
            <option value="Spanish">Spanish</option>
            <option value="Brazilian Portuguese">Português (Brasil)</option>
          </select>
        </label>
      </section>

      <section
        class="language-card companion-language-card"
        id="companion-language-card"
        aria-label="Companion language"
        hidden
      >
        <label for="companion-language">
          <span>Language</span>
          <select id="companion-language">
            <option value="English">English</option>
            <option value="Spanish">Español</option>
            <option value="Brazilian Portuguese">Português (Brasil)</option>
          </select>
        </label>
      </section>

      <section class="status-card" aria-live="polite">
        <span class="status-dot" id="status-dot" data-state="idle"></span>
        <div>
          <span class="status-label">Status</span>
          <strong id="status-text">Ready</strong>
        </div>
      </section>

      <section class="controls" aria-label="Voice controls">
        <button class="primary-button" id="start-button" type="button">
          Start Interpreter
        </button>
        <button class="stop-button" id="stop-button" type="button" disabled>
          Stop
        </button>
      </section>

      <div id="interpreter-transcripts">
        <section class="transcript-card">
          <h2>Latest original speech</h2>
          <p id="original-transcript" class="transcript" aria-live="polite">
            The latest English or Spanish speech will appear here.
          </p>
        </section>

        <section class="transcript-card">
          <h2>Translated result</h2>
          <p id="translation-transcript" class="transcript" aria-live="polite">
            The translation will appear here.
          </p>
        </section>
      </div>

      <section class="transcript-card" id="companion-transcript-card" hidden>
        <h2>Conversation</h2>
        <div id="conversation-log" class="conversation-log" aria-live="polite">
          <p class="conversation-placeholder">
            Your conversation with Companion will appear here.
          </p>
        </div>
      </section>

      <audio id="translated-audio" autoplay playsinline></audio>
    </main>
  </body>
</html>
