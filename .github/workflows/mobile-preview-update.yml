name: Publish mobile preview update

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-preview-update.yml'
  workflow_dispatch:

concurrency:
  group: mobile-preview-update
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to preview channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add EXPO_TOKEN in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Validate mobile app
        working-directory: mobile
        run: pnpm typecheck
      - name: Publish preview update
        working-directory: mobile
        run: eas update --channel preview --environment preview --message "main@${GITHUB_SHA::7}" --non-interactive
